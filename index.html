<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>維修報價查詢</title>
<style>
  :root{--bg:#0a0a0f;--card:#16161f;--accent:#00e5ff;--accent2:#ff2d78;--accent3:#ffe600;--text:#f0f0f5;--muted:#6a6a8a;--border:#252535}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',system-ui,sans-serif;min-height:100vh}
  header{background:linear-gradient(135deg,#0d0d18,#1a0a2e 60%,#0a1828);padding:16px;text-align:center;border-bottom:2px solid var(--accent);position:sticky;top:0;z-index:100}
  .logo{font-family:system-ui,sans-serif;font-size:24px;font-weight:900;letter-spacing:-0.5px}
  .logo .hi{color:var(--accent)}.logo .fix{color:var(--accent2)}.logo .sub{color:#fff;font-size:0.65em;font-weight:700}
  .wrap{max-width:680px;margin:0 auto;padding:16px 12px 140px}
  .sec-label{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;margin-top:20px;display:flex;align-items:center;gap:8px}
  .sec-label::after{content:'';flex:1;height:1px;background:var(--border)}
  .series-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .series-scroll::-webkit-scrollbar{display:none}
  .s-btn{flex-shrink:0;background:var(--card);border:1.5px solid var(--border);color:var(--muted);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all 0.15s}
  .s-btn.active{background:var(--accent);border-color:var(--accent);color:#000}
  .model-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  .m-card{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;transition:all 0.15s;user-select:none}
  .m-card:active{transform:scale(0.97)}.m-card.selected{border-color:var(--accent);background:rgba(0,229,255,0.07)}
  .m-card .m-icon{font-size:22px;margin-bottom:4px}.m-card .m-name{font-size:11px;font-weight:700;color:var(--text);line-height:1.35}
  .m-card.selected .m-name{color:var(--accent)}
  .repair-list{display:flex;flex-direction:column;gap:7px}
  .r-item{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:13px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all 0.12s;user-select:none}
  .r-item:active{transform:scale(0.99)}.r-item.selected{border-color:var(--accent2);background:rgba(255,45,120,0.08)}.r-item.unavail{opacity:0.3;cursor:default}
  .r-icon{font-size:20px;flex-shrink:0;width:28px;text-align:center}
  .r-name{font-size:14px;font-weight:700;color:var(--text);line-height:1.3;flex:1}
  .r-item.selected .r-name{color:var(--accent2)}
  .r-price{font-size:17px;font-weight:900;color:var(--accent3);flex-shrink:0}
  .r-price.na{font-size:12px;color:var(--border);font-weight:400}
  .r-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;transition:all 0.12s;color:transparent}
  .r-item.selected .r-check{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .placeholder{text-align:center;padding:28px 16px;color:var(--muted);font-size:13px;border:2px dashed var(--border);border-radius:14px}
  .placeholder .big{font-size:36px;display:block;margin-bottom:8px}
  .total-bar{position:fixed;bottom:0;left:0;right:0;padding:10px 12px 20px;z-index:200;display:none;background:linear-gradient(to top,#0a0a0f 70%,transparent)}
  .total-bar.show{display:block}
  .total-inner{max-width:680px;margin:0 auto;background:linear-gradient(135deg,#1a0830,#0a1828);border:2px solid var(--accent);border-radius:18px;padding:14px 18px;display:flex;align-items:center;gap:12px}
  .total-left{flex:1;min-width:0}
  .total-label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
  .total-items{font-size:12px;color:var(--text);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .total-right{flex-shrink:0;text-align:right}
  .total-amount{font-size:30px;font-weight:900;color:var(--accent3);line-height:1}
  .total-count{font-size:11px;color:var(--muted);margin-top:2px}
  .clear-btn{background:rgba(255,45,120,0.12);border:1.5px solid var(--accent2);color:var(--accent2);border-radius:10px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0;white-space:nowrap}
</style>
</head>

  </div>
</div>

let selSeries=null,selModel=null,selModelIdx=null,selected={};

const tabsEl=document.getElementById('seriesTabs');
Object.keys(data).forEach(s=>{
  const btn=document.createElement('button');
  btn.className='s-btn';btn.textContent=s;
  btn.onclick=()=>selectSeries(s,btn);
  tabsEl.appendChild(btn);
});

function selectSeries(s,btn){
  selSeries=s;selModel=null;selModelIdx=null;selected={};
  document.querySelectorAll('.s-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderModels();renderRepairs();updateTotal();
}
function renderModels(){
  const grid=document.getElementById('modelGrid');grid.innerHTML='';
  data[selSeries].models.forEach((m,i)=>{
    const c=document.createElement('div');c.className='m-card';
    c.innerHTML=`<div class="m-icon">📱</div><div class="m-name">${m}</div>`;
    c.onclick=()=>selectModel(m,i,c);grid.appendChild(c);
  });
}
function selectModel(m,i,el){
  selModel=m;selModelIdx=i;selected={};
  document.querySelectorAll('.m-card').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  renderRepairs();updateTotal();
}
function renderRepairs(){
  const list=document.getElementById('repairList');list.innerHTML='';
  if(!selModel){list.innerHTML='<div class="placeholder"><span class="big">🔧</span>請先選擇機型</div>';return;}
  Object.entries(data[selSeries].repairs).forEach(([name,prices])=>{
    const price=prices[selModelIdx];const avail=price&&price>0;
    const el=document.createElement('div');el.className='r-item'+(avail?'':' unavail');
    el.innerHTML=`<div class="r-icon">${icons[name]||'🔧'}</div><div class="r-name">${name}</div><div class="${avail?'r-price':'r-price na'}">${avail?'NT$'+price.toLocaleString():'不支援'}</div><div class="r-check">✓</div>`;
    if(avail)el.onclick=()=>toggle(el,name,price);
    list.appendChild(el);
  });
}
function toggle(el,name,price){
  if(selected[name]){delete selected[name];el.classList.remove('selected');}
  else{selected[name]=price;el.classList.add('selected');}
  updateTotal();
}
function updateTotal(){
  const keys=Object.keys(selected);
  const total=Object.values(selected).reduce((a,b)=>a+b,0);
  const bar=document.getElementById('totalBar');
  if(!keys.length){bar.classList.remove('show');return;}
  bar.classList.add('show');
  document.getElementById('totalAmount').textContent='NT$'+total.toLocaleString();
  document.getElementById('totalItems').textContent=keys.join('、');
  document.getElementById('totalCount').textContent=`共 ${keys.length} 項`;
}
function clearAll(){
  selected={};
  document.querySelectorAll('.r-item.selected').forEach(el=>el.classList.remove('selected'));
  updateTotal();
}
</script>
